<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Web Library</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="img/library.png">
    </head>   
    <body>
        <header>
            <h1 class="page-title">Avail Books</h1>
            <nav>
                <button id="start-page-button" class="nav-button" type="button">Start Page</button>
                <button id="admin-panel-button" class="nav-button" type="button">Edit The databse (Admin only!)</button>
                <div id="online-status">
                    <div id="status-dot"></div>
                    <div id="status-username">
                        <button id="status-username-button"></button>
                        <div id="status-username-dropdown">
                            <button id="log-out-button">Log Out</button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <form class="search-form">
                <div class="form-field">
                    <label for="search">Search</label>
                    <input type="text" id="search" name="search">
                </div>
                <div>
                    <button type="submit">Search</button>
                    <button type="button" id="refresh">Refresh</button>
                </div>
            </form>
            <table class="book-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Knjiga</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
        <footer>Predrag Vuckovic 2026</footer>
        <script src="books.js"></script>
        <script src="statusBar.js"></script>
    </body>
</html>
