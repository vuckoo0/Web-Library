<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sign Up | My Library</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="assets/img/library.png">
    </head>
    <body>
        <header>
            <h1 class="page-title">Account</h1>
            <nav>
                <button id="start-page-button" class="nav-button" type="button">Start Page</button>
                <div id="online-status">
                    <div id="status-dot"></div>
                    <div id="status-username">
                        <button id="status-username-button"></button>
                        <div id="status-username-dropdown"></div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <form id="sign-up-form" class="book-form">
                <h2>Create Account</h2>
                <div class="form-field">
                    <label for="sign-up-user-name">Username: </label>
                    <input type="text" id="sign-up-user-name" name="user-name">
                </div>
                <div class="form-field">
                    <label for="sign-up-password">Password: </label>
                    <input type="text" id="sign-up-password" name="user-password">
                </div>
                <button type="submit">Sign Up</button>
                <p class="account-switch">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </main>
        <footer>
            <p>Predrag Vuckovic 2026</p>
            <a href="https://github.com/vuckoo0/Web-Library">Github repo of the site</a>
        </footer>
        <script src="login.js"></script>
        <script src="statusBar.js"></script>
    </body>
</html>
