<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add a Book</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="img/library.png">
    </head>
    <body>
        <header>
            <h1 class="page-title">Edit the Database!</h1>
            <nav>
                <button id="start-page-button" class="nav-button" type="button">Start Page</button>
                <button id="books-button" class="nav-button" type="button">Books</button>
                <div id="online-status">
                    <div id="status-dot"></div>
                    <div id="status-username">
                        <button id="status-username-button"></button>
                        <div id="status-username-dropdown">
                            <button id="log-out-button">Log Out</button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="option">
                <h2>Add a Book</h2>
                <form class="book-form">
                    <div class="form-field">
                        <label for="title">Knjiga:</label>
                        <input type="text" id="title" name="title">
                    </div>              
                    <div class="form-field">
                        <label for="author">Autor:</label>
                        <input type="text" id="author" name="author">
                    </div>
                    <div class="form-field">
                        <label for="isbn">ISBN:</label>
                        <input type="text" id="isbn" name="isbn">
                    </div>               
                    <button type="submit">Add book</button>
                </form>
            </div>
            <div class="option">
                <h2>Edit an existing book in the Database</h2>
                <div class="edit-book" style="gap:16px">
                    <form class="edit-book-form">
                        <div class="form-field">
                            <label for="change-book-title">Id of the book being edited:</label>
                            <input type="number" id="change-book-title" name="change-book-title">
                        </div>
                    </form>
                    <div class="book-field-selector">
                        <label for="field">Select the field you want to change:</label>
                        <select name="field" id="field" style="font-family: 'Lora', serif;">
                            <option value="">Select Field</option>
                            <option value="Title">Title</option>
                            <option value="Author">Author</option>
                            <option value="ISBN">ISBN</option>
                        </select>
                    </div>
                    <form class="edit-book-form">
                        <div class="form-field">
                            <label for="field-value">Enter the new value: </label>
                            <input type="text" id="field-value" name="field-value">
                        </div>
                    </form>  
                    <button type="submit">Change</button>
                </div>
            </div>
        </main>
        <footer>Predrag Vuckovic 2026</footer>
        <script src="adminPanel.js"></script>
        <script src="statusBar.js"></script>
    </body>
</html>
