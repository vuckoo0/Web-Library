<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Log in Page</title>
    </head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/library.png">
    <body>
        <header>
            <h1 class="page-title">Account</h1>
            <nav>
                <button id="start-page-button" class="nav-button" type="button">Start Page</button>
                <div id="online-status">
                    <div id="status-dot"></div>
                    <div id="status-username">
                        <button id="status-username-button"></button>
                        <div id="status-username-dropdown">
                            <button id="log-out-button">Log Out</button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <form id="log-in-form" class="book-form">
                <h2>Log In</h2>
                <div class="form-field">
                    <label for="log-in-user-name">Username: </label>
                    <input type="text" id="log-in-user-name" name="user-name">
                </div>
                <div class="form-field">
                    <label for="log-in-user-password">Password: </label>
                    <input type="text" id="log-in-user-password" name="user-password">
                </div>
                <button type="submit">Enter</button>
            </form>
            <form id="sign-up-form" class="book-form">
                <h2>Sign Up</h2>
                 <div class="form-field">
                    <label for="sign-up-user-name">Username: </label>
                    <input type="text" id="sign-up-user-name" name="user-name">
                </div>
                <div class="form-field">
                    <label for="sign-up-password">Password: </label>
                    <input type="text" id="sign-up-password" name="user-password">
                </div>
                <button type="submit">Enter</button>
            </form>
        </main>
        <footer>
            <div>
                <p>Predrag Vuckovic 2026</p>
                <a href="https://github.com/vuckoo0/Web-Library">Github repo of the site</a>
            </div>  
        </footer>
        <script src="login.js"></script>
        <script src="statusBar.js"></script>
    </body>
</html>
